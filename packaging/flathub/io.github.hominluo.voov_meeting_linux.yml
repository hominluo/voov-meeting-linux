id: io.github.hominluo.voov_meeting_linux
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: voov-meeting
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --own-name=com.tencent.wemeet
modules:
  - name: voov-meeting
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 voov-meeting.sh /app/bin/voov-meeting
      - install -Dm644 voov-meeting.desktop /app/share/applications/io.github.hominluo.voov_meeting_linux.desktop
      - install -Dm644 voov-256.png /app/share/icons/hicolor/256x256/apps/io.github.hominluo.voov_meeting_linux.png
      - install -Dm644 voov-512.png /app/share/icons/hicolor/512x512/apps/io.github.hominluo.voov_meeting_linux.png
      - install -Dm644 voov.svg /app/share/icons/hicolor/scalable/apps/io.github.hominluo.voov_meeting_linux.svg
      - install -Dm644 io.github.hominluo.voov_meeting_linux.metainfo.xml /app/share/metainfo/io.github.hominluo.voov_meeting_linux.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/io.github.hominluo.voov_meeting_linux/LICENSE
      - install -Dm644 NOTICE /app/share/licenses/io.github.hominluo.voov_meeting_linux/NOTICE
    sources:
      - type: extra-data
        filename: voov-meeting.deb
        url: https://github.com/hominluo/voov-meeting-linux/releases/download/v3.26.10.401-1/voov-meeting_3.26.10.401-1_amd64.deb
        sha256: 16af780c727929c2d23acc1befbe434eb2380bd5233e7c9fbdcac4b9c4caaf21
        size: 197406644
        only-arches:
          - x86_64
      - type: file
        path: apply_extra
      - type: file
        path: voov-meeting.sh
      - type: file
        path: voov-meeting.desktop
      - type: file
        path: voov-256.png
      - type: file
        path: voov-512.png
      - type: file
        path: voov.svg
      - type: file
        path: io.github.hominluo.voov_meeting_linux.metainfo.xml
      - type: file
        path: LICENSE
      - type: file
        path: NOTICE
